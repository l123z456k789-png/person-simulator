[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "person-simulator"
version = "0.1.0"
description = "Turn a cleaned two-person chat into a standalone role-play Markdown profile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
person-sim = "person_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
person_simulator = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
