[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "person-simulator"
version = "0.2.0"
description = "Turn a cleaned two-person chat into a standalone role-play profile, or host a controlled third-party simulation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "person-simulator contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2"]

[project.scripts]
person-sim = "person_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
person_simulator = ["prompts/*.txt", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
