name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --maxfail=1

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build
        run: python -m build
      - name: Verify artifacts
        run: |
          python - <<'PY'
          import pathlib, sys, tarfile, zipfile

          root = pathlib.Path("dist")
          artifacts = list(root.glob("*.whl")) + list(root.glob("*.tar.gz"))
          assert artifacts, "no build artifacts"
          forbidden = ("data/", "runs/", "exports/", "eval_runs/", "config.toml", ".env", ".psim")
          required = "person_simulator/server/static/index.html"

          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
              lowered = [name.lower() for name in names]
              bad = [name for name in lowered if any(part in name for part in forbidden)]
              if bad:
                  print(f"{artifact}: forbidden paths: {bad[:10]}", file=sys.stderr)
                  sys.exit(1)
              if not any(name.endswith(required) for name in lowered):
                  print(f"{artifact}: missing {required}", file=sys.stderr)
                  sys.exit(1)
              print(f"{artifact}: ok ({len(names)} entries)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
